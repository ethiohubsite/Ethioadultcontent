
<!DOCTYPE html>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 20% 15%, #ff8fbf 0%, #ff5fa2 45%, #e83e8c 100%);
    color: #ffffff;
    font-family: 'Poppins', 'Noto Sans Ethiopic', sans-serif;
    text-align: center;
    padding: 24px;
    overflow: hidden;
    position: relative;
  }

  body::before, body::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    filter: blur(70px);
    background: rgba(255, 255, 255, 0.25);
    z-index: 0;
  }
  body::before { width: 320px; height: 320px; top: -80px; left: -80px; }
  body::after  { width: 380px; height: 380px; bottom: -120px; right: -100px; }

  .card {
    position: relative;
    z-index: 1;
    max-width: 640px;
    width: 100%;
    padding: 56px 32px;
    border-radius: 28px;
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.45);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 25px 60px rgba(120, 0, 60, 0.35);
    animation: rise 1s ease both;
  }

  .badge {
    display: inline-block;
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 6px 16px;
    border: 1px solid rgba(255,255,255,0.7);
    border-radius: 50px;
    margin-bottom: 26px;
  }

  .welcome {
    font-size: 15px;
    font-weight: 300;
    letter-spacing: 6px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(34px, 8vw, 58px);
    font-weight: 800;
    line-height: 1.15;
    text-shadow: 0 4px 20px rgba(120, 0, 60, 0.35);
    margin-bottom: 8px;
  }

  .sub {
    font-family: 'Playfair Display', serif;
    font-size: clamp(18px, 4vw, 24px);
    font-weight: 600;
    margin-bottom: 24px;
  }

  .divider {
    width: 80px;
    height: 3px;
    margin: 0 auto 24px;
    border-radius: 3px;
    background: #ffffff;
    opacity: 0.9;
  }

  .quality {
    font-size: 18px;
    font-weight: 400;
    margin-bottom: 10px;
  }

  .am {
    font-family: 'Noto Sans Ethiopic', sans-serif;
    font-size: clamp(20px, 5vw, 28px);
    font-weight: 700;
    margin: 18px 0 34px;
  }

  .btn {
    display: inline-block;
    padding: 15px 44px;
    border-radius: 50px;
    background: #ffffff;
    color: #e83e8c;
    font-weight: 600;
    font-size: 16px;
    letter-spacing: 1px;
    text-decoration: none;
    box-shadow: 0 10px 30px rgba(120, 0, 60, 0.35);
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .btn:hover { transform: translateY(-3px) scale(1.03); box-shadow: 0 16px 36px rgba(120, 0, 60, 0.45); }

  .notice {
    margin-top: 30px;
    font-size: 12px;
    opacity: 0.85;
    line-height: 1.6;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
  <main class="card">
    <span class="badge">18+ Only</span>

    <p class="welcome">Welcome to</p>
    <h1>Beauty's Adult Content</h1>
    <p class="sub">Beauty's Hub 🩷</p>

    <div class="divider"></div>

    <p class="quality">Premium &amp; High Quality Videos</p>
    <p class="quality">ጥራት ያለው video</p>

    <p class="am">በማየት ፈታ ይበሉ</p>

    <a href="#" class="btn">Enter • ግቡ</a>

    <p class="notice">
      ይህ ገጽ ዕድሜያቸው 18 እና ከዚያ በላይ ለሆኑ ብቻ ነው።<br>
      This site is intended for adults aged 18 and over only.
    </p>
  </main>
</body>
</html>
