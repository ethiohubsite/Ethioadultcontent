<!DOCTYPE html>
<html lang="am">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beauty's Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Poppins:wght@300;400;600&family=Noto+Sans+Ethiopic:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 20% 15%, #ff8fbf 0%, #ff5fa2 45%, #e83e8c 100%);
    color: #ffffff;
    font-family: 'Poppins', 'Noto Sans Ethiopic', sans-serif;
    text-align: center;
    padding: 28px 18px;
    position: relative;
    overflow-x: hidden;
  }

  body::before, body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    background: rgba(255, 255, 255, 0.28);
    z-index: 0;
  }
  body::before { width: 340px; height: 340px; top: -90px; left: -90px; }
  body::after  { width: 400px; height: 400px; bottom: -130px; right: -110px; }

  .card {
    position: relative;
    z-index: 1;
    max-width: 700px;
    width: 100%;
    padding: 60px 34px;
    border-radius: 32px;
    background: rgba(255, 255, 255, 0.13);
    border: 1px solid rgba(255, 255, 255, 0.5);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 30px 70px rgba(120, 0, 60, 0.4), inset 0 1px 0 rgba(255,255,255,0.4);
    animation: rise 1s ease both;
  }

  .badge {
    display: inline-block;
    font-size: 12px;
    letter-spacing: 4px;
    text-transform: uppercase;
    padding: 7px 20px;
    border: 1px solid rgba(255,255,255,0.8);
    border-radius: 50px;
    margin-bottom: 28px;
  }

  .welcome {
    font-size: 14px;
    font-weight: 300;
    letter-spacing: 8px;
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(36px, 9vw, 64px);
    font-weight: 800;
    line-height: 1.12;
    margin-bottom: 10px;
    text-shadow: 0 4px 24px rgba(120, 0, 60, 0.4);
  }

  .sub {
    font-family: 'Playfair Display', serif;
    font-size: clamp(20px, 5vw, 28px);
    font-weight: 600;
    letter-spacing: 2px;
    margin-bottom: 26px;
  }

  .divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin: 0 auto 28px;
  }
  .divider span { width: 70px; height: 2px; background: #fff; opacity: .85; border-radius: 2px; }
  .divider i { font-style: normal; font-size: 18px; }

  .quality {
    font-size: 17px;
    font-weight: 400;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }

  .am-main {
    font-family: 'Noto Sans Ethiopic', sans-serif;
    font-size: clamp(24px, 6.5vw, 36px);
    font-weight: 800;
    line-height: 1.4;
    margin: 22px 0 18px;
    text-shadow: 0 3px 16px rgba(120, 0, 60, 0.35);
  }

  .am-long {
    font-family: 'Noto Sans Ethiopic', sans-serif;
    font-size: clamp(18px, 4.8vw, 24px);
    font-weight: 600;
    line-height: 1.8;
    max-width: 560px;
    margin: 0 auto 30px;
    padding: 20px 22px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.16);
    border: 1px solid rgba(255, 255, 255, 0.45);
    box-shadow: 0 10px 30px rgba(120, 0, 60, 0.25);
  }
  .am-long strong { font-weight: 800; letter-spacing: .5px; }

  .chips {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-bottom: 38px;
  }
  .chips span {
    font-size: 13px;
    padding: 8px 18px;
    border-radius: 50px;
    border: 1px solid rgba(255,255,255,0.7);
    background: rgba(255,255,255,0.12);
    letter-spacing: 1px;
  }

  .btn {
    display: inline-block;
    padding: 17px 54px;
    border-radius: 50px;
    background: #ffffff;
    color: #e83e8c;
    font-weight: 600;
    font-size: 17px;
    letter-spacing: 2px;
    text-decoration: none;
    box-shadow: 0 12px 34px rgba(120, 0, 60, 0.4);
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .btn:hover { transform: translateY(-3px) scale(1.04); box-shadow: 0 18px 40px rgba(120, 0, 60, 0.5); }

  .notice {
    margin-top: 34px;
    font-size: 12px;
    opacity: .88;
    line-height: 1.7;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(30px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
  <main class="card">
    <span class="badge">18+ Only</span>

    <p class="welcome">Welcome to</p>
    <h1>Beauty's Adult Content</h1>
    <p class="sub">Beauty's Hub 🩷</p>

    <div class="divider"><span></span><i>🩷</i><span></span></div>

    <p class="quality">Premium &amp; High Quality Videos</p>
    <p class="quality">ጥራት ያለው video</p>

    <p class="am-main">በማየት ፈታ ይበሉ</p>

    <p class="am-long">
      የ <strong>EthioSex</strong> ምርጥ video እና photo የያዘ ይመልከቱ 🩷
    </p>

    <div class="chips">
      <span>ጥራት ያለው</span>
      <span>በየጊዜው አዲስ</span>
      <span>Premium</span>
    </div>

    <a href="#" class="btn">Enter • ግቡ</a>

    <p class="notice">
      ይህ ገጽ ዕድሜያቸው 18 እና ከዚያ በላይ ለሆኑ ብቻ ነው።<br>
      This site is intended for adults aged 18 and over only.
    </p>
  </main>
</body>
</html>
